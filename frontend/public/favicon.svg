<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>

  <!-- Antenna -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="#F0C33C" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="3" fill="#F0C33C"/>

  <!-- Head -->
  <rect x="10" y="14" width="44" height="36" rx="8" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1.5"/>

  <!-- Left eye -->
  <circle cx="22" cy="30" r="7" fill="#111" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="22" cy="30" r="4" fill="#7C3AED"/>
  <circle cx="22" cy="30" r="2" fill="#A78BFA"/>
  <circle cx="23.5" cy="28.5" r="1" fill="white" opacity="0.9"/>

  <!-- Right eye -->
  <circle cx="42" cy="30" r="7" fill="#111" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="42" cy="30" r="4" fill="#7C3AED"/>
  <circle cx="42" cy="30" r="2" fill="#A78BFA"/>
  <circle cx="43.5" cy="28.5" r="1" fill="white" opacity="0.9"/>

  <!-- Mouth / grid -->
  <rect x="19" y="42" width="26" height="5" rx="2.5" fill="#111" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="25.5" y1="42" x2="25.5" y2="47" stroke="#F0C33C" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="42" x2="32" y2="47" stroke="#F0C33C" stroke-width="1" opacity="0.6"/>
  <line x1="38.5" y1="42" x2="38.5" y2="47" stroke="#F0C33C" stroke-width="1" opacity="0.6"/>

  <!-- Ears -->
  <rect x="6" y="24" width="4" height="12" rx="2" fill="#2A2A2A"/>
  <rect x="54" y="24" width="4" height="12" rx="2" fill="#2A2A2A"/>
</svg>
