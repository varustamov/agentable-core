[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentable-core"
version = "0.1.3"
description = "Agent-readiness auditing SDK and MCP server for seo4agent.com"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "mcp", "llm", "audit", "seo"]
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
agentable-mcp = "agentable.mcp_server:main"

[project.urls]
Homepage = "https://seo4agent.com"
Repository = "https://github.com/varustamov/agentable-core"

[tool.hatch.build.targets.wheel]
packages = ["agentable"]
